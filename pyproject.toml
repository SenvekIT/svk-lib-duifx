[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duifx"
dynamic = ["version"]
description = "A modern PySide6-based GUI framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "David Senoner", email = "david.senoner@davtec.it"}
]
keywords = ["gui", "PySide6", "desktop", "ui", "framework", "usb", "can"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PySide6>=6.5.0",
    "pyusb>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.990",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/davidsenoner/DUIFx"
Documentation = "https://github.com/davidsenoner/DUIFx#readme"
Repository = "https://github.com/davidsenoner/DUIFx"
"Bug Tracker" = "https://github.com/davidsenoner/DUIFx/issues"

[project.scripts]
duifx = "duifx.main:main"

[tool.setuptools]
packages = ["duifx"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "duifx.__version__"}

[tool.setuptools.package-data]
duifx = [
    "gui/resources/*.qss",
    "gui/resources/image/*",
    "gui/resources/icon/*.svg",
    "gui/ui/*.ui",
]