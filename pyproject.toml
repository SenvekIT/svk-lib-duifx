[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duifx"
dynamic = ["version"]
description = "A modern PySide6-based GUI framework"
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression per PEP 639. Note: the legacy
# "License :: OSI Approved :: ..." classifier must NOT be added alongside it --
# setuptools >= 77 rejects the combination with an InvalidConfigError.
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.md"]
authors = [
    {name = "Senvek SRL", email = "info@senvek.com"}
]
keywords = ["gui", "PySide6", "desktop", "ui", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
# duifx.gui.plot: TimeSeriesPlot and ScatterPlot draw with pyqtgraph. Without
# it they show a hint instead of curves; everything else works.
plot = [
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.990",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/SenvekIT/svk-lib-duifx"
Documentation = "https://github.com/SenvekIT/svk-lib-duifx#readme"
Repository = "https://github.com/SenvekIT/svk-lib-duifx"
"Bug Tracker" = "https://github.com/SenvekIT/svk-lib-duifx/issues"

[tool.setuptools]
packages = ["duifx", "duifx.gui", "duifx.gui.ui"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "duifx.version.__version__"}

[tool.setuptools.package-data]
duifx = [
    "gui/resources/*.qss",
    "gui/resources/icon/*.svg",
    "gui/ui/*.ui",
]